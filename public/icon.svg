<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #0a0a0a; }
      .foreground { stroke: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #ffffff; }
      .foreground { stroke: #0a0a0a; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="37" />
  <!-- The λ signature — same geometry as lib/brand/mark.ts, scaled into 180×180
       (100-unit space → translate(30,30) scale(1.2)). -->
  <g class="foreground" transform="translate(30,30) scale(1.2)" fill="none"
     stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="16" x2="74" y2="86" />
    <line x1="53" y1="48" x2="24" y2="86" />
  </g>
</svg>
