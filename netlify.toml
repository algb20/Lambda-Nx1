# Lambda NX — Netlify deploy configuration.
#
# Hosting default per charter §4 (Netlify + Supabase): keeps the already-verified
# Pi domain and the existing Pi payment functions. Swappable — moving to Vercel or
# self-host is a config change, not an app rewrite (providers sit behind lib/*).

[build]
  command = "npm run build"
  publish = ".next"
  # Pi payment endpoints (approve/complete/cancel) are classic Netlify Functions.
  functions = "netlify/functions"

[build.environment]
  # Node version lives in .nvmrc — Netlify, Vercel and local nvm all read it, so
  # there is one source of truth instead of a per-host copy that can drift.
  #
  # No NPM_FLAGS: the dependency tree resolves under npm's strict peer rules, so
  # `npm install` needs no --legacy-peer-deps escape hatch. Keep it that way — the
  # flag would silently hide the next real peer conflict instead of surfacing it.
  #
  # Do not fail the build on Next telemetry / lint (tsc still gates types).
  NEXT_TELEMETRY_DISABLED = "1"

# The official Next.js runtime — SSR, route handlers, image handling on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers (CSP, HSTS, X-Frame-Options, …) and the /api/health no-store
# rule are defined portably in next.config.mjs `headers()`, so they apply
# identically on Netlify, Vercel and self-host. Keeping them in one place avoids
# drift and duplicate headers.
